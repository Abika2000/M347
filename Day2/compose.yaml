services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8081}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - vaultwarden
    networks:
      - frontend
    cpus: 0.5
    mem_limit: 128m

  nginx-scale:
    image: nginx:1.27-alpine
    profiles:
      - scaling
    restart: unless-stopped
    ports:
      - "127.0.0.1::443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - vaultwarden
    networks:
      - frontend
    cpus: 0.5
    mem_limit: 128m

  vaultwarden:
    image: vaultwarden/server:1.36.0
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:-https://localhost:8081}"
      SIGNUPS_ALLOWED: "${SIGNUPS_ALLOWED:-true}"
      DATABASE_URL: "postgresql://vaultwarden:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/vaultwarden"
    volumes:
      - vaultwarden_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    cpus: 1.0
    mem_limit: 512m

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultwarden
      POSTGRES_USER: vaultwarden
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultwarden -d vaultwarden"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    cpus: 1.0
    mem_limit: 512m

networks:
  frontend:
  backend:
    internal: true

volumes:
  vaultwarden_data:
  postgres_data:
