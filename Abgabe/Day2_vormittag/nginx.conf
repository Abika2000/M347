# Preserve normal HTTP connections while allowing WebSocket upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    # Terminate HTTPS using the local self-signed certificate.
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    # Allow Vaultwarden attachment uploads up to this size.
    client_max_body_size 525M;

    location / {
        # Forward requests and WebSockets to the Vaultwarden container.
        proxy_pass http://vaultwarden:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Pass the original host, client address, and protocol to the application.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
